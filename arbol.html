<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de Árbol — Keiser Trees</title>
  <meta name="description" content="Información detallada sobre la especie botánica en el campus de Keiser University Latin American Campus.">

  <!-- Fuentes: Ranade (Opción A: Fontshare) + Inter (Google Fonts) -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=ranade@400,500,600,700&display=swap">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

  <!-- Hojas de estilo unificadas -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ficha.css">
</head>

<body>

  <!-- Cabecera Hero reducida con banner -->
  <header class="hero-header" style="height: 180px;">
    <div class="hero-content">
      <h2 style="color: #fff; margin-bottom: 0.25rem; font-size: clamp(1.4rem, 3vw, 2.2rem);">Árboles del Campus</h2>
      <p style="font-size: 0.95rem;">Keiser University Latin American Campus</p>
    </div>
  </header>

  <!-- Contenedor principal de la ficha -->
  <main class="container">
    <nav aria-label="Navegación de retorno" style="margin-top: var(--space-md);">
      <a class="ficha-back" href="index.html">← Volver al catálogo</a>
    </nav>

    <!-- Contenedor dinámico (manejado por js/app-ficha.js) -->
    <div id="ficha-contenedor" aria-live="polite">
      <!-- Se inyecta dinámicamente: spinner de carga, ficha completa o mensaje de no encontrado -->
      <div class="ficha-loading" role="status">
        <div class="kt-spinner" aria-hidden="true" style="width: 2.5rem; height: 2.5rem; border: 3px solid var(--color-primary-light); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p>Cargando información del árbol…</p>
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="colorful-footer">
    <div class="container">
      <p>Keiser University Latin American Campus — Guía de Árboles del Campus</p>
      <small>Proyecto SGA 2025-2026 · Iniciativa de Sostenibilidad y Educación Ambiental</small>
    </div>
  </footer>

  <!-- Controlador ES Module de la ficha -->
  <script type="module" src="js/app-ficha.js"></script>

</body>

</html>
